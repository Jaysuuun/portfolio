name: Deploy Flask Portfolio

on:
  push:
    branches:
      - main  # Trigger on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repo
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Build Docker image
    - name: Build Docker image
      run: docker build -t jaysuuun/flask-portfolio:latest .

    # 4. Push image to Docker Hub
    - name: Push Docker image
      run: docker push jaysuuun/flask-portfolio:latest

    # 5. SSH into EC2 and deploy
    - name: Deploy on EC2
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Pull the latest image
          docker pull jaysuuun/flask-portfolio:latest

          # Stop & remove old container if exists
          docker stop my-portfolio-container || true
          docker rm my-portfolio-container || true

          # Run new container
          docker run -d --name my-portfolio-container -p 5000:5000 --restart unless-stopped jaysuuun/flask-portfolio:latest
